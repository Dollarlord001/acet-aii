# ACET AI — Netlify configuration
# Secrets must be set in the Netlify UI or CLI — never in this file.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Official Next.js runtime for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
